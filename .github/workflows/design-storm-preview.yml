name: Expanded design storms preview only
on:
  push:
    branches: [experiment/all-route-storm-preview]
    paths: [tools/scenarios/run-request.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: expanded-design-storm-preview
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/live
            tools/scenarios
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy h5py eccodes
      - name: Verify exact forcing and publisher protections
        run: |
          python -m unittest discover -s tools/scenarios -p 'test_*.py' -v
          python -m unittest discover -s tools/live -p 'test_*.py' -v
          python - <<'PY'
          import json
          r=json.load(open('tools/scenarios/run-request.json'))
          assert r['purpose']=='isolated_test_deployment'
          assert r['productionPublication'] is False
          assert r['solverCapSeconds']==5400
          assert r['scenarios']==['stress','extreme']
          assert r['cases']==['northern','picture-rocks','gates']
          PY
  run:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {case: northern, scenario: stress}
          - {case: northern, scenario: extreme}
          - {case: picture-rocks, scenario: stress}
          - {case: picture-rocks, scenario: extreme}
          - {case: gates, scenario: stress}
          - {case: gates, scenario: extreme}
    env:
      OMP_NUM_THREADS: '4'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/live
            tools/scenarios
      - name: Read only pinned case and original storm inputs
        run: |
          dirs=$(python3 -c "import json,os;c=next(c for c in json.load(open('tools/live/all-route-cases.json'))['cases'] if c['case']=='${{ matrix.case }}');print(' '.join(sorted({os.path.dirname(c['caseManifest']),os.path.dirname(c['faceMapping']['path']),os.path.dirname(c['geometry']['path'])})))")
          git sparse-checkout add $dirs tools/sfincs/data/stress-storm-v1 tools/sfincs/data/extreme-storm-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libnetcdf-dev libgfortran5 libgomp1
          python -m pip install numpy h5py eccodes
      - name: Find saved pinned engine
        id: engine
        run: |
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=sfincs-engine&per_page=20" --jq '[.artifacts[]|select(.expired|not)][0].workflow_run.id')
          test -n "$id" && test "$id" != null
          echo "run=$id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: sfincs-engine
          path: engine-download
          run-id: ${{ steps.engine.outputs.run }}
          github-token: ${{ github.token }}
      - name: Verify engine and prepare exact design storm
        run: |
          mkdir engine
          tar -xzf engine-download/sfincs-engine.tar.gz -C engine
          (cd engine && sha256sum -c SHA256SUMS)
          test "$(cat engine/SOURCE_COMMIT)" = f3647fc0289bb15cb2512d60686cef74cb853c78
          echo 'c4917bc54158b0943d6d128b45c4346a33d059fb5d93808d05520c975e38f090  engine/sfincs' | sha256sum -c -
          python tools/scenarios/run_design_storm.py prepare '${{ matrix.case }}' '${{ matrix.scenario }}' work .
      - name: Run bounded native scenario
        run: |
          set -euo pipefail
          (cd work && GFORTRAN_UNBUFFERED_ALL=y timeout 5400 "$GITHUB_WORKSPACE/engine/sfincs" > solver.log 2>&1) || { tail -20 work/solver.log; exit 1; }
          tail -10 work/solver.log
      - name: Export and validate preview output only
        run: python tools/scenarios/run_design_storm.py export '${{ matrix.case }}' '${{ matrix.scenario }}' work out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-${{ matrix.scenario }}-${{ matrix.case }}
          path: |
            out/
            work/scenario-case.json
            work/solver.log
          retention-days: 2
          compression-level: 6
