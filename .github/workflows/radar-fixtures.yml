name: Experimental radar fixture validation
on:
  push:
    branches: ['experiment/avra-radar-runoff']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radar-fixtures-${{ github.ref }}
  cancel-in-progress: true
jobs:
  decode-recorded-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/simulation/requirements-radar.txt
      - run: python -m unittest discover -s test -p '*_test.py' -v
