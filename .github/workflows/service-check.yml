name: Check the alert service
# Run by hand: asks the Google Apps Script alert service whether it's up and what it sees.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Service status
        run: curl -sSL -m 60 "https://script.google.com/macros/s/AKfycbyUBBx52nXVcdFB-AFy-dXslYBOKA6XrTzxeaAadGcWZ7xeafEa_BdsljbYwp8tk_EBGg/exec" ; echo
      - name: River gauges through the service
        run: |
          curl -sSL -m 90 "https://script.google.com/macros/s/AKfycbyUBBx52nXVcdFB-AFy-dXslYBOKA6XrTzxeaAadGcWZ7xeafEa_BdsljbYwp8tk_EBGg/exec?feed=usgs" > usgs.json
          python3 - <<'PY'
          import json
          d = json.load(open('usgs.json'))
          print('fetched_at', d.get('fetched_at'))
          for k, v in (d.get('series') or {}).items():
              print(k, v['features'][-1]['properties'] if v and v.get('features') else None)
          if 'series' not in d: print(d)
          PY
      - name: County rain feed through the service
        run: curl -sSL -m 90 "https://script.google.com/macros/s/AKfycbyUBBx52nXVcdFB-AFy-dXslYBOKA6XrTzxeaAadGcWZ7xeafEa_BdsljbYwp8tk_EBGg/exec?feed=alert" | head -c 600 ; echo
