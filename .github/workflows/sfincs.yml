name: SFINCS experimental source verification
on:
  push:
    branches: [experiment/sfincs-engine]
    paths: ['tools/sfincs/**', '.github/workflows/sfincs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  solver:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gfortran build-essential autoconf automake libtool pkg-config libnetcdf-dev
          python -m pip install -r tools/sfincs/requirements.txt
      - name: Build pinned official GPL source
        run: bash tools/sfincs/build-source.sh "$RUNNER_TEMP/sfincs-source" > source-build.log 2>&1
      - name: Run observed Cortaro inflow through real terrain
        run: |
          for threshold in 0.01 0.005; do
            python tools/sfincs/prepare_reach.py "runs/reach-$threshold" --terrain tools/sfincs/data/reach-terrain --upstream tools/sfincs/data/gauges/cortaro-benchmark-2014-09.json --threshold "$threshold"
            (cd "runs/reach-$threshold" && timeout 300 "$RUNNER_TEMP/sfincs-source/source/src/sfincs" > solver.log 2>&1)
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sfincs-verification
          path: |
            source-build.log
            runs/
          retention-days: 7
