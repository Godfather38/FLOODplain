name: SFINCS real reach execution
on:
  workflow_dispatch:
    inputs:
      engine_run_id:
        description: 'Existing run containing the pinned sfincs-engine artifact; no build fallback'
        type: string
        required: true
        default: '41290378239'
      case_archive:
        description: 'Prepared current case archive in this branch; empty retains explicit historical replay'
        type: string
        required: false
        default: ''
      execution_cap_seconds:
        description: 'Approved maximum native solver runtime in seconds'
        type: choice
        options: ['120', '1200', '2400', '2700', '3600', '5400', '7200', '10800']
        default: '3600'
permissions:
  contents: read
  actions: read
jobs:
  solver:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    env:
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require existing engine
        run: test -n '${{ inputs.engine_run_id }}'
      - name: Install runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libnetcdf-dev libgfortran5 libgomp1
          python -m pip install -r tools/sfincs/requirements.txt
      - name: Retrieve persisted engine from earlier runner
        uses: actions/download-artifact@v4
        with:
          name: sfincs-engine
          path: engine-download
          run-id: ${{ inputs.engine_run_id }}
          github-token: ${{ github.token }}
      - name: Verify retrieved executable and source
        run: |
          mkdir engine-reused
          tar -xzf engine-download/sfincs-engine.tar.gz -C engine-reused
          (cd engine-reused && sha256sum -c SHA256SUMS)
          test "$(cat engine-reused/SOURCE_COMMIT)" = f3647fc0289bb15cb2512d60686cef74cb853c78
          echo "c4917bc54158b0943d6d128b45c4346a33d059fb5d93808d05520c975e38f090  engine-reused/sfincs" | sha256sum -c -
          test -x engine-reused/sfincs
          ldd engine-reused/sfincs | tee engine-reused/current-runtime-libraries.txt
          ! grep -q 'not found' engine-reused/current-runtime-libraries.txt
      - name: Retrieve unchanged antecedent case
        if: inputs.case_archive == ''
        uses: actions/download-artifact@v4
        with:
          name: sfincs-verification
          path: reference-download
          run-id: '41297523344'
          github-token: ${{ github.token }}
      - name: Retrieve preserved 2014 development case
        if: inputs.case_archive == ''
        uses: actions/download-artifact@v4
        with:
          name: sfincs-verification
          path: reference-2014
          run-id: '41293656870'
          github-token: ${{ github.token }}
      - name: Run both events with one published channel setup
        if: inputs.case_archive == ''
        run: |
          python tools/sfincs/stage_prefab_case.py reference-download/runs/reach-antecedent-2013 runs/prefab-2013
          python tools/sfincs/stage_prefab_case.py reference-2014/runs/reach-levee runs/prefab-2014
          (cd runs/prefab-2013 && timeout 1200 "$GITHUB_WORKSPACE/engine-reused/sfincs" > solver.log 2>&1)
          python tools/sfincs/export_reach.py runs/prefab-2013 --target tools/sfincs/data/gauges/trico-evaluation-2013-07.json
          (cd runs/prefab-2014 && timeout 600 "$GITHUB_WORKSPACE/engine-reused/sfincs" > solver.log 2>&1)
          python tools/sfincs/export_reach.py runs/prefab-2014 --target tools/sfincs/data/gauges/trico-benchmark-2014-09.json
          (cd engine-reused && sha256sum -c SHA256SUMS)
      - name: Run prepared current case with saved engine
        if: inputs.case_archive != ''
        env:
          CASE_ARCHIVE: ${{ inputs.case_archive }}
          EXECUTION_CAP_SECONDS: ${{ inputs.execution_cap_seconds }}
        run: |
          python - <<'PY'
          import os, tarfile, json, hashlib
          from pathlib import Path
          cap = int(os.environ['EXECUTION_CAP_SECONDS'])
          if cap not in {120, 1200, 2400, 2700, 3600, 5400, 7200, 10800}:
              raise ValueError('Unsupported execution cap')
          archive = Path(os.environ['CASE_ARCHIVE']).resolve()
          root = Path('tools/sfincs/data').resolve()
          if not archive.is_relative_to(root) or not archive.is_file():
              raise ValueError('Require committed prepared case under tools/sfincs/data')
          if archive.suffix == '.json':
              manifest = json.loads(archive.read_text())
              if manifest.get('modelVersion') not in {'silverbell-extension-v1', 'all-routes-northern-v3', 'all-routes-picture-rocks-v2', 'all-routes-gates-supported-v2', 'all-routes-gates-full-v3'}:
                  raise ValueError('Require a recognized prepared case version')
              combined = Path('prepared-case.tar.gz')
              with combined.open('wb') as target:
                  for item in manifest['parts']:
                      part = (archive.parent / item['path']).resolve()
                      if part.parent != archive.parent:
                          raise ValueError('Archive part escaped its directory')
                      data = part.read_bytes()
                      if len(data) != item['bytes'] or hashlib.sha256(data).hexdigest() != item['sha256']:
                          raise ValueError('Archive part hash mismatch')
                      target.write(data)
              if hashlib.sha256(combined.read_bytes()).hexdigest() != manifest['archiveSha256']:
                  raise ValueError('Reassembled case hash mismatch')
              archive = combined
          output = Path('runs/current')
          output.mkdir(parents=True)
          with tarfile.open(archive, 'r:gz') as tf:
              tf.extractall(output, filter='data')
          for name in ['sfincs.inp', 'sfincs.dis', 'sfincs.src', 'precip_2d.nc', 'current-case.json', 'GCN10-NOTICE.txt']:
              if not (output/name).is_file():
                  raise ValueError('Incomplete prepared case: '+name)
          PY
          (set -o pipefail; cd runs/current && date -u +%FT%TZ > execution-started.txt && GFORTRAN_UNBUFFERED_ALL=y timeout "$EXECUTION_CAP_SECONDS" "$GITHUB_WORKSPACE/engine-reused/sfincs" 2>&1 | tee solver.log)
          (cd engine-reused && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sfincs-verification
          path: |
            engine-reused/SHA256SUMS
            engine-reused/current-runtime-libraries.txt
            runs/
          retention-days: 7
