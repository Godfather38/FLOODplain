name: SFINCS real reach execution
on:
  workflow_dispatch:
    inputs:
      engine_run_id:
        description: 'Existing run containing the pinned sfincs-engine artifact; no build fallback'
        type: string
        required: true
        default: '41290378239'
permissions:
  contents: read
  actions: read
jobs:
  solver:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require existing engine
        run: test -n '${{ inputs.engine_run_id }}'
      - name: Install runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libnetcdf-dev libgfortran5 libgomp1
          python -m pip install -r tools/sfincs/requirements.txt
      - name: Retrieve persisted engine from earlier runner
        uses: actions/download-artifact@v4
        with:
          name: sfincs-engine
          path: engine-download
          run-id: ${{ inputs.engine_run_id }}
          github-token: ${{ github.token }}
      - name: Verify retrieved executable and source
        run: |
          mkdir engine-reused
          tar -xzf engine-download/sfincs-engine.tar.gz -C engine-reused
          (cd engine-reused && sha256sum -c SHA256SUMS)
          test "$(cat engine-reused/SOURCE_COMMIT)" = f3647fc0289bb15cb2512d60686cef74cb853c78
          echo "c4917bc54158b0943d6d128b45c4346a33d059fb5d93808d05520c975e38f090  engine-reused/sfincs" | sha256sum -c -
          test -x engine-reused/sfincs
          ldd engine-reused/sfincs | tee engine-reused/current-runtime-libraries.txt
          ! grep -q 'not found' engine-reused/current-runtime-libraries.txt
      - name: Retrieve unchanged antecedent case
        uses: actions/download-artifact@v4
        with:
          name: sfincs-verification
          path: reference-download
          run-id: '41297523344'
          github-token: ${{ github.token }}
      - name: Compare independently mapped source cell with unchanged hydraulics
        run: |
          python tools/sfincs/prepare_placement.py reference-download/runs/reach-antecedent-2013 runs/reach-placement-2013
          (cd runs/reach-placement-2013 && timeout 600 "$GITHUB_WORKSPACE/engine-reused/sfincs" > solver.log 2>&1)
          python tools/sfincs/export_reach.py runs/reach-placement-2013 --target tools/sfincs/data/gauges/trico-evaluation-2013-07.json
          (cd engine-reused && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sfincs-verification
          path: |
            engine-reused/SHA256SUMS
            engine-reused/current-runtime-libraries.txt
            runs/
          retention-days: 7
