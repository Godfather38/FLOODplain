name: Snapshot Pima ALERT rain/stream data
# The county ALERT feed has no CORS headers, so the app can't read it directly.
# Every ~10 min this copies the Avra Valley sensors to the `data` branch, which
# the app reads from raw.githubusercontent.com. GitHub runs schedules only from
# the default branch, and may start them several minutes late.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: alert-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ALERT sensors
        run: mkdir -p out && python3 tools/snapshot_alert.py out/alert.json
      - name: Publish to data branch (single commit, force-pushed)
        working-directory: out
        run: |
          git init -q -b data
          git config user.name "alert-snapshot"
          git config user.email "actions@users.noreply.github.com"
          git add alert.json
          git commit -qm "ALERT snapshot $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
