name: Deploy morning check to GitHub Pages
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
  deploy:
    # GitHub Pages only accepts deploys from the repo's default branch.
    if: github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp this version so phones load it, not an old cached copy
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" public/index.html public/app.js
      - name: Frozen model runs are for development only; never publish them
        run: node tools/prune-published.mjs public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
