name: Wash Watch alerts
# Every 15 minutes: run the same check as the app and post it to the ntfy topics
# for this time slot. People subscribe in the free ntfy app to the topic for the
# time, days and mode they picked on the app's Alerts screen:
#   washwatch-HHMM-{wd|all}-{all|off}
# Arizona is UTC-7 all year. GitHub's free scheduler can start a few minutes late;
# the slot is the 15-minute block the run starts in.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notify
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
    steps:
      - name: Work out the time slot (Arizona)
        id: slot
        run: |
          H=$(TZ=America/Phoenix date +%H); M=$(TZ=America/Phoenix date +%M); D=$(TZ=America/Phoenix date +%u)
          SLOT=$(printf '%02d%02d' "$((10#$H))" "$(( (10#$M / 15) * 15 ))")
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "weekday=$([ "$D" -le 5 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          # Alerts can be picked from 4:00 AM to 9:45 PM.
          echo "active=$([ "$((10#$H))" -ge 4 ] && [ "$((10#$H))" -le 21 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "Arizona slot $SLOT, weekday=$([ "$D" -le 5 ] && echo yes || echo no)"
      - uses: actions/checkout@v4
        if: steps.slot.outputs.active == 'yes' || github.event_name == 'workflow_dispatch'
      - uses: actions/setup-node@v4
        if: steps.slot.outputs.active == 'yes' || github.event_name == 'workflow_dispatch'
        with:
          node-version: 22
      - name: Check conditions
        if: steps.slot.outputs.active == 'yes' || github.event_name == 'workflow_dispatch'
        run: |
          python3 tools/snapshot_alert.py alert.json || echo '{}' > alert.json
          node tools/notify.mjs alert.json > msg.json
          cat msg.json
      - name: Send to this slot's topics
        if: steps.slot.outputs.active == 'yes' || github.event_name == 'workflow_dispatch'
        env:
          SLOT: ${{ steps.slot.outputs.slot }}
          WEEKDAY: ${{ steps.slot.outputs.weekday }}
        run: |
          TITLE=$(jq -r .title msg.json); BODY=$(jq -r .text msg.json); OFF=$(jq -r .off msg.json)
          DAYS="all"; [ "$WEEKDAY" = yes ] && DAYS="all wd"
          # Topics can be any minute; this fallback covers every minute of the 15-minute block.
          H=${SLOT:0:2}; M0=$((10#${SLOT:2:2}))
          for k in $(seq 0 14); do
            MIN=$(printf '%s%02d' "$H" "$((M0 + k))")
            for d in $DAYS; do
              TOPIC="$MIN-$d"
              curl -fsS -o /dev/null -H "Title: $TITLE" -H "Click: https://godfather38.github.io/FLOODplain/" -H "Tags: droplet" -d "$BODY" "https://ntfy.sh/washwatch-$TOPIC-all" || true
              [ "$OFF" = true ] && curl -fsS -o /dev/null -H "Title: $TITLE" -H "Tags: droplet" -d "$BODY" "https://ntfy.sh/washwatch-$TOPIC-off" || true
            done
          done
          echo "posted block $SLOT"
          # Times outside 4:00 AM-9:45 PM aren't covered by this fallback.
