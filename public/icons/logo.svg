<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Wash Watch</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#e8743b"/>
    </linearGradient>
    <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="url(#sky)"/>
    <circle cx="46" cy="16" r="7" fill="#fff3d6"/>
    <path d="M0 33 H64 V64 H0 Z" fill="#8a4b2a"/>
    <!-- road dipping through the wash -->
    <path d="M-2 33 H13 C22 33 22 53 32 53 C42 53 42 33 51 33 H66" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <!-- water standing over the road in the dip -->
    <path d="M18.6 42 H45.4 Q42 56.5 32 56.5 Q22 56.5 18.6 42 Z" fill="#3ea0ff" fill-opacity="0.92"/>
    <path d="M20 42 q3 -2.2 6 0 t6 0 t6 0 t6 0" fill="none" stroke="#d6efff" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
